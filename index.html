=====================================================================
 HIVE NOTES — README
=====================================================================
 A single-file, offline web app for recording beehive inspections.
 No internet, server, or install needed.

 HOW TO OPEN ON A PHONE
  Option A (just the file):
   1. Copy hive-notes.html to your phone (email it to yourself, USB,
      Google Drive / iCloud Files, etc.) and save it to the device.
   2. Open it in Chrome (Android) or Safari (iPhone), e.g. via the
      Files app > tap the file > open with Chrome/Safari.
  Option B (host for free, easiest for home-screen use):
   - Netlify Drop: go to https://app.netlify.com/drop and drag the
     folder containing this file (rename it index.html first).
   - GitHub Pages: put it in a repo as index.html and enable Pages.
   Then open the URL on your phone.

 ADD TO HOME SCREEN
  - Android (Chrome): open the page > menu (three dots) >
    "Add to Home screen".
  - iPhone (Safari): open the page > Share button >
    "Add to Home Screen".

 YOUR DATA
  All hives, inspections and photos are stored in this browser's
  localStorage ON THIS DEVICE ONLY. They are not synced or backed up.
  Clearing browser data, using private mode, or opening the file in
  a different browser/device/URL will show a different (empty) set.
  Storage is ~5MB, so photos are shrunk (max 1024px, JPEG 0.7).
  Use "Export backup" on the home screen to download a dated .json
  backup (includes photos); "Import backup" restores it (merge or
  replace). An in-app "How to install & help" section is on home.
=====================================================================

<title>Hive Notes</title>
<style>
:root{--bg:#121613;--bg2:#1a201b;--card:#212a23;--card2:#283229;--line:#3a473c;--text:#f4f1e8;--muted:#c3c9bd;--amber:#ffb627;--amber2:#ffcc5c;--amberInk:#1b1405;--danger:#ff6b5b;--ok:#7ddc8c;--r:16px;--shadow:0 6px 20px rgba(0,0,0,.35);--font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:var(--font);font-size:18px;line-height:1.35;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;background:radial-gradient(900px 500px at 100% -10%,#24301f 0,transparent 60%),var(--bg)}
header{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(18,22,19,.96);border-bottom:1px solid var(--line)}
.logo{width:34px;height:38px;position:relative;flex:none}
.logo i{position:absolute;width:15px;height:17px;background:var(--amber);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.logo i:nth-child(1){left:0;top:0}.logo i:nth-child(2){left:17px;top:0;background:var(--amber2)}.logo i:nth-child(3){left:8.5px;top:14px;background:#e89a10}
.resumeBar{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 12px;border:2px solid var(--honey,#ffb627);border-radius:12px;background:rgba(255,182,39,.08)}.resumeBar .grow{flex:1}.resumeBar button{flex:none}
.homeTap{cursor:pointer}
.brand.homeTap{text-decoration:underline;text-decoration-color:rgba(255,182,39,.7);text-decoration-thickness:1.5px;text-underline-offset:4px}
.brand{font-weight:800;font-size:1.2rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{min-width:52px;min-height:52px;padding:0;border-radius:50%;font-size:1.3rem}
#micBtn.on{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,107,91,.25)}}
main{flex:1;min-height:0;width:100%;max-width:720px;margin:0 auto;padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:in .25s ease both}

ds (varroa, brood, queen cells, super, small hive beetle&hellip;) are auto-corrected.</p></div>'+

function importHives(hives,mode){fh={s:{}};saveFH();var before=JSON.stringify(state),bAll=JSON.stringify(state.hives);
  if(mode==='replace')state={hives:hives};
  else hives.forEach(function(h){var ex=hive(h.id);if(!ex){state.hives.push(h);return;}h.inspections.forEach(function(i){if(!ex.inspections.some(function(x){return x.id===i.id;}))ex.inspections.push(i);});});
  if(save()){pushU({t:'all',j:bAll,label:'Import backup'});toast('Backup imported');go({name:'home'});return true;}state=JSON.parse(before);return false;}

  var n=hives.reduce(function(a,h){return a+h.inspections.length;},0),msg='Backup contains '+hives.length+' hive(s) and '+n+' inspection(s).\n\n',ok=false;
  if(!state.hives.length){if(confirm(msg+'Import it?'))ok=importHives(hives,'replace');}
  else if(confirm(msg+'OK = MERGE with your current data (keeps everything, adds what is new).\nCancel = more options.'))ok=importHives(hives,'merge');

   Notes: SpeechRecognition only works in a secure context (https or localhost).
   Opened as file:// or content:// (e.g. from Downloads), Chrome blocks the mic,

 'service-not-allowed':'Speech service not allowed here. Open the app from a web link (https) and allow the microphone.',

function setInd(state,msg,heard){
  if(!ind){ind=document.createElement('div');ind.id='listen';ind.setAttribute('role','status');ind.setAttribute('aria-live','polite');
    ind.innerHTML='<span class="dot"></span><div class="grow"><b class="st"></b> <div class="meta msg"></div><div class="heard"></div></div><button type="button" class="danger" style="min-height:48px">Stop</button>';
    ind.querySelector('button').onclick=function(){if(rec){stopListen();resumeHF();}else endUI();};document.body.appendChild(ind);}
  ind.dataset.state=state;ind.querySelector('.st').textContent={starting:'Starting mic…',listening:'Listening…',error:'Voice problem',done:'Heard:'}[state]||state;
  ind.querySelector('.msg').textContent=msg||'';if(heard!=null)ind.querySelector('.heard').textContent=heard?'“'+heard+'”':'';
  ind.querySelector('.dot').style.display=state==='error'?'none':'';ind.querySelector('button').textContent=state==='error'?'Close':'Stop';
  ind.style.borderColor=state==='error'?'var(--amber)':'';}
function endUI(keep){clearTimeout(watchdog);if(recBtn)recBtn.classList.remove('on');micBtn.classList.remove('on');recBtn=null;rec=null;if(ind&&!keep){ind.remove();ind=null;}}
function stopListen(){if(rec){var r=rec;rec=null;r._user=true;try{r.abort();}catch(e){}try{if(r._flush)r._flush();}catch(e){}}endUI();}

var actT=null;
function vtList(){if(route.name==='form')return ['date','strength','weather','queenSeen','brood','honey','pests','treatments','notes','photos'];if(route.name==='addHive')return ['hName','hNotes'];return [];}

function vtMove(d){var L=vtList(),i=L.indexOf(actT),j=i+d;if(j<0)return 'Already at the first box';if(j>=L.length)return route.name==='form'?'Last box – say “finish” to complete':'Last box – say “save” to add the hive';setVT(L[j]);return 'Now: '+vtName(L[j]);}
