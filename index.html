=====================================================================
 HIVE NOTES — README
=====================================================================
 A single-file, offline web app for recording beehive inspections.
 No internet, server, or install needed.

 HOW TO OPEN ON A PHONE
  Option A (just the file):
   1. Copy hive-notes.html to your phone (email it to yourself, USB,
      Google Drive / iCloud Files, etc.) and save it to the device.
   2. Open it in Chrome (Android) or Safari (iPhone), e.g. via the
      Files app > tap the file > open with Chrome/Safari.
  Option B (host for free, easiest for home-screen use):
   - Netlify Drop: go to https://app.netlify.com/drop and drag the
     folder containing this file (rename it index.html first).
   - GitHub Pages: put it in a repo as index.html and enable Pages.
   Then open the URL on your phone.

 ADD TO HOME SCREEN
  - Android (Chrome): open the page > menu (three dots) >
    "Add to Home screen".
  - iPhone (Safari): open the page > Share button >
    "Add to Home Screen".

 YOUR DATA
  All hives, inspections and photos are stored in this browser's
  localStorage ON THIS DEVICE ONLY. They are not synced or backed up.
  Clearing browser data, using private mode, or opening the file in
  a different browser/device/URL will show a different (empty) set.
  Storage is ~5MB, so photos are shrunk (max 1024px, JPEG 0.7).
  Use "Export backup" on the home screen to download a dated .json
  backup (includes photos); "Import backup" restores it (merge or
  replace). An in-app "How to install & help" section is on home.
=====================================================================

<title>Hive Notes</title>
<style>
:root{--bg:#121613;--bg2:#1a201b;--card:#212a23;--card2:#283229;--line:#3a473c;--text:#f4f1e8;--muted:#c3c9bd;--amber:#ffb627;--amber2:#ffcc5c;--amberInk:#1b1405;--danger:#ff6b5b;--ok:#7ddc8c;--r:16px;--shadow:0 6px 20px rgba(0,0,0,.35);--font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:var(--font);font-size:18px;line-height:1.35;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;background:radial-gradient(900px 500px at 100% -10%,#24301f 0,transparent 60%),var(--bg)}
header{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(18,22,19,.96);border-bottom:1px solid var(--line)}
.logo{width:34px;height:38px;position:relative;flex:none}
.logo i{position:absolute;width:15px;height:17px;background:var(--amber);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.logo i:nth-child(1){left:0;top:0}.logo i:nth-child(2){left:17px;top:0;background:var(--amber2)}.logo i:nth-child(3){left:8.5px;top:14px;background:#e89a10}
.brand{font-weight:800;font-size:1.2rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{min-width:52px;min-height:52px;padding:0;border-radius:50%;font-size:1.3rem}
#micBtn.on{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,107,91,.25)}}
main{flex:1;min-height:0;width:100%;max-width:720px;margin:0 auto;padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:1.45rem;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);margin:0 0 8px;font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 2px 6px}
button,.btn{font:inherit;font-weight:700;min-height:52px;min-width:52px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;transition:transform .12s,background .15s,border-color .15s;box-shadow:0 2px 6px rgba(0,0,0,.3);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;-webkit-tap-highlight-color:transparent}
button:hover,.btn:hover{border-color:var(--amber)}button:active,.btn:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber2);outline-offset:2px}
.primary{background:var(--amber);color:var(--amberInk);border-color:var(--amber)}.primary:hover{background:var(--amber2)}
.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.bar{flex:none;display:flex;gap:10px;padding-top:10px}.bar>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.tap{display:block;width:100%;text-align:left;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.title{font-size:1.12rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:.85rem}
.chev{color:var(--amber);font-size:1.6rem;font-weight:800}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:800;border:1px solid var(--line);margin-top:4px}
.pill.weak{color:var(--danger);border-color:var(--danger)}.pill.medium{color:var(--amber2);border-color:var(--amber2)}.pill.strong{color:var(--ok);border-color:var(--ok)}
label,.lbl{display:block;font-weight:700;font-size:.9rem;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;min-height:52px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--text)}
textarea{min-height:52px;height:84px;resize:none}
.fr{display:flex;gap:8px;align-items:stretch}.fr>input,.fr>textarea{flex:1;min-width:0}
.mic{min-width:52px;padding:0;font-size:1.2rem;flex:none}.mic.on{background:var(--danger);border-color:var(--danger);color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1 1 0;min-width:0;padding:8px 6px;font-size:.95rem}
.seg button[aria-pressed=true]{background:var(--amber);color:var(--amberInk);border-color:var(--amber)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips button{min-height:48px;padding:6px 12px;font-size:.88rem;border-radius:999px}
.tabs{flex:none;display:flex;gap:6px;margin-bottom:4px}.tabs button{flex:1;font-size:.9rem;padding:6px}.tabs button[aria-current=true]{border-color:var(--amber);color:var(--amber2)}
.step{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:6px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;min-height:44px;min-width:44px;padding:0;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;border:2px solid #fff}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}.dl dt{color:var(--muted);font-weight:600}.dl dd{margin:0;white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;padding:18px 14px}.empty svg{width:96px;height:96px}.empty p{color:var(--muted);margin:4px 0 14px}
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:in .22s ease both}
.overlay .ohead{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.overlay .obody{flex:1;overflow-y:auto;padding:14px;max-width:720px;width:100%;margin:0 auto}
.overlay h3{font-size:1.05rem;margin:14px 0 6px;color:var(--amber2)}.overlay ol,.overlay ul{margin:0;padding-left:22px;color:var(--muted)}.overlay li{margin:6px 0}.overlay b{color:var(--text)}
.viewer{background:rgba(0,0,0,.96)}.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
#listen{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:70;max-width:600px;margin:auto;background:#0b0e0c;border:2px solid var(--danger);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
#listen .dot{width:16px;height:16px;border-radius:50%;background:var(--danger);flex:none;animation:pulse 1s infinite}
#listen .heard{color:var(--amber2);font-weight:700}
.toast{position:fixed;left:12px;right:12px;top:max(70px,calc(env(safe-area-inset-top) + 64px));margin:auto;max-width:600px;background:var(--text);color:#111;font-weight:700;padding:12px 16px;border-radius:14px;z-index:80;box-shadow:var(--shadow);animation:in .2s ease both}
.toast.err{background:var(--danger);color:#fff}
.busy{color:var(--amber2);font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-height:700px){textarea{height:60px}label,.lbl{margin-top:6px}}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(96px + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 76px 1fr;align-items:center;gap:10px;background:linear-gradient(to top,rgba(18,22,19,.98) 70%,rgba(18,22,19,0));pointer-events:none}
#dock>*{pointer-events:auto}
#micBtn{width:76px;height:76px;min-width:76px;border-radius:50%;padding:0;font-size:2rem;background:var(--amber);color:var(--amberInk);border:3px solid var(--amber2);box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 0 4px rgba(255,182,39,.15)}
#micBtn:hover{background:var(--amber2)}
#micBtn.hf{background:var(--ok);border-color:#b6f0bf;color:#0c1a0e;animation:pulse 1.4s infinite}
#hfStatus{font-size:.8rem;color:var(--muted);line-height:1.2;overflow:hidden;max-height:64px}
#hfStatus b{color:var(--text);display:block}#hfStatus.on b{color:var(--ok)}
#hfStatus .hd{color:var(--amber2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#hfBtn{justify-self:end;min-height:52px;padding:6px 10px;font-size:.85rem;border-radius:14px;line-height:1.1}
#hfBtn[aria-pressed=true]{background:var(--ok);color:#0c1a0e;border-color:var(--ok)}
main{padding-bottom:calc(100px + env(safe-area-inset-bottom))!important}
#listen{bottom:calc(104px + env(safe-area-inset-bottom))!important}
@keyframes hfpulse{50%{opacity:.35}}#hfStatus.on b::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px;animation:hfpulse 1.2s infinite}

#blockCard{position:fixed;left:12px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:65;max-width:600px;margin:auto;min-height:72px;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px;background:linear-gradient(135deg,#2c3a2e,#212a23);color:var(--text);border:3px solid var(--amber);border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.6);animation:in .25s ease both}
#blockCard b{color:var(--amber2);font-size:1.1rem}

.overlay .intro{color:var(--amber2);font-weight:800;font-size:1.1rem;margin:0 0 6px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.gtabs button{flex:1 1 30%;min-height:48px;font-size:.85rem;padding:6px 8px}
.gtabs button[aria-selected=true]{background:var(--amber);color:var(--amberInk);border-color:var(--amber)}
.gfr{margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.gfr svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}.gfr figcaption{text-align:left;margin-top:6px;font-size:.95rem}.gfr figcaption b{color:var(--amber2)}
ol.setup{padding-left:24px;margin:0}ol.setup li{margin:0 0 12px;color:var(--muted)}ol.setup b{color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="brand">Hive Notes</div>
  <button id="backBtn" class="icon" hidden aria-label="Back">&#8592;</button>
  <button id="helpBtn" class="icon" aria-label="Help and backup" title="Help &amp; backup">?</button>
</header>
<main id="app"></main>
<div id="dock"><div id="hfStatus" aria-live="polite"><b>Tap to speak</b><span class="hd"></span></div><button id="micBtn" aria-label="Voice: tap and speak" title="Voice">&#127908;</button><button id="hfBtn" type="button" aria-pressed="false" title="Hands-free mode">Hands-free<br>Off</button></div>
<script>
(function(){
'use strict';
var KEY='hiveNotes.v1';
var state=load(),app=document.getElementById('app'),backBtn=document.getElementById('backBtn'),micBtn=document.getElementById('micBtn');
var route={name:'home'},draft=null;
var WEATHER=['sunny','cloudy','overcast','windy','calm','rainy','hot','warm','mild','cool','cold','humid'];
var BROOD=['solid','spotty','patchy','none seen'],HONEY=['low','medium','good','full'];
var TEXTF={weather:'Weather',pests:'Pests / disease',treatments:'Treatments',notes:'Notes'};

function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.hives))return d;}catch(e){}return{hives:[]};}
function isQuota(e){return e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){
  toast(isQuota(e)?'Storage is full! This was NOT saved. Remove some photos or delete old inspections (export a backup first via ?), then try again.':'Could not save: '+e.message,true);state=load();return false;}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function fmtDate(s){var p=(s||'').split('-');if(p.length!==3)return s||'';return new Date(+p[0],p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function hive(id){return state.hives.filter(function(h){return h.id===id;})[0];}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
var tt;function toast(msg,err){var o=document.querySelector('.toast');if(o)o.remove();var t=document.createElement('div');t.className='toast'+(err?' err':'');t.setAttribute('role','alert');t.textContent=msg;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(function(){t.remove();},err?6000:2500);}
function usage(){try{return Math.round((localStorage.getItem(KEY)||'').length*2/1024);}catch(e){return 0;}}
function cmp(a,b){return (b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0);}

var ART={
 hive:'<svg viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="104" rx="40" ry="6" fill="#000" opacity=".3"/><rect x="28" y="30" width="64" height="16" rx="5" fill="#ffb627"/><rect x="24" y="46" width="72" height="18" rx="5" fill="#ffcc5c"/><rect x="28" y="64" width="64" height="18" rx="5" fill="#ffb627"/><rect x="24" y="82" width="72" height="18" rx="5" fill="#e89a10"/><rect x="52" y="90" width="16" height="6" rx="3" fill="#1b1405"/><circle cx="94" cy="24" r="6" fill="#f4f1e8"/><circle cx="94" cy="24" r="3" fill="#1b1405"/></svg>',
 note:'<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="30" y="18" width="60" height="84" rx="8" fill="#283229" stroke="#ffb627" stroke-width="4"/><path d="M42 42h36M42 56h36M42 70h22" stroke="#c3c9bd" stroke-width="5" stroke-linecap="round"/><polygon points="86,76 98,83 98,97 86,104 74,97 74,83" fill="#ffb627"/></svg>',
 photo:'<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="18" y="34" width="84" height="60" rx="10" fill="#283229" stroke="#ffb627" stroke-width="4"/><rect x="44" y="24" width="32" height="14" rx="4" fill="#ffb627"/><circle cx="60" cy="64" r="16" fill="none" stroke="#ffcc5c" stroke-width="5"/></svg>'
};
function empty(art,title,msg,btn,act){return '<div class="card empty">'+ART[art]+'<div class="title">'+title+'</div><p>'+msg+'</p>'+(btn?'<button class="primary" data-act="'+act+'">'+btn+'</button>':'')+'</div>';}

/* ---------- views ---------- */
function go(r){route=r;render();}
function render(){backBtn.hidden=route.name==='home';var h=({home:vHome,addHive:vAddHive,hive:vHive,form:vForm,insp:vInsp}[route.name]||vHome)();
  app.innerHTML='<section class="screen">'+h+'</section>';if(route.name==='form')showStep();}
function vHome(){var n=state.hives.length;
  var s='<h1>Your hives</h1><p class="sub">'+n+' hive'+(n===1?'':'s')+' &middot; ~'+usage()+' KB of ~5 MB used</p><div class="panel">';
  if(!n)s+=empty('hive','No hives yet','Add your first hive to start logging inspections. Tip: tap &#127908; and say &ldquo;add hive&rdquo;.','+ Add your first hive','addHive');
  state.hives.forEach(function(h){var c=h.inspections.length,last=c?h.inspections.slice().sort(cmp)[0]:null;
    s+='<button class="card tap" data-act="openHive" data-id="'+h.id+'"><div class="row"><div class="grow"><div class="title">'+esc(h.name)+'</div><div class="meta">'+c+' inspection'+(c===1?'':'s')+(last?' &middot; last '+esc(fmtDate(last.date)):'')+'</div>'+(last&&last.strength?'<span class="pill '+esc(last.strength)+'">'+esc(last.strength)+'</span>':'')+'</div><span class="chev">&rsaquo;</span></div></button>';});
  s+='</div>';if(n)s+='<div class="bar"><button class="primary" data-act="addHive">+ Add hive</button></div>';return s;}
function micFor(id){return '<button type="button" class="mic" data-act="dictate" data-target="'+id+'" aria-label="Dictate">&#127908;</button>';}
function vAddHive(){return '<h1>New hive</h1><form id="hiveForm" class="screen" style="animation:none"><div class="panel"><label for="hName">Hive name *</label><div class="fr"><input id="hName" maxlength="80" placeholder="e.g. Hive 1 – Orchard">'+micFor('hName')+'</div><label for="hNotes">Notes (optional)</label><div class="fr"><textarea id="hNotes" placeholder="Location, origin, queen info…"></textarea>'+micFor('hNotes')+'</div></div><div class="bar"><button type="button" data-act="home">Cancel</button><button class="primary" type="submit">Save hive</button></div></form>';}
function vHive(){var h=hive(route.id);if(!h){route={name:'home'};return vHome();}
  var s='<h1>'+esc(h.name)+'</h1>'+(h.notes?'<p class="sub">'+esc(h.notes)+'</p>':'<p class="sub">Inspection history</p>')+'<div class="panel">';
  if(!h.inspections.length)s+=empty('note','No inspections yet','Record what you see on your next visit to this hive.','+ Add first inspection','newInsp');
  h.inspections.slice().sort(cmp).forEach(function(i){s+='<button class="card tap" data-act="openInsp" data-id="'+i.id+'"><div class="row"><div class="grow"><div class="title">'+esc(fmtDate(i.date))+'</div><div class="meta">'+[i.weather,i.queenSeen==='yes'?'Queen seen':i.queenSeen==='no'?'Queen not seen':'',i.photos.length?i.photos.length+' photo'+(i.photos.length>1?'s':''):''].filter(Boolean).map(esc).join(' &middot; ')+'</div>'+(i.strength?'<span class="pill '+esc(i.strength)+'">'+esc(i.strength)+'</span>':'')+'</div><span class="chev">&rsaquo;</span></div></button>';});
  return s+'</div><div class="bar"><button class="danger" data-act="delHive">Delete hive</button>'+(h.inspections.length?'<button class="primary" data-act="newInsp">+ Inspection</button>':'')+'</div>';}
function seg(field,opts,labels){return '<div class="seg" role="group">'+opts.map(function(o,ix){return '<button type="button" data-act="seg" data-f="'+field+'" data-v="'+o+'" aria-pressed="'+(draft[field]===o)+'">'+(labels?labels[ix]:cap(o))+'</button>';}).join('')+'</div>';}
function tf(id,ph,ta){return '<label for="f_'+id+'">'+TEXTF[id]+'</label><div class="fr">'+(ta?'<textarea id="f_'+id+'" data-f="'+id+'" placeholder="'+ph+'">'+esc(draft[id])+'</textarea>':'<input id="f_'+id+'" data-f="'+id+'" placeholder="'+ph+'" value="'+esc(draft[id])+'">')+micFor('f_'+id)+'</div>';}
var STEPS=['Colony','Health','Notes & photos'];
function vForm(){var h=hive(route.id);
  return '<h1>New inspection</h1><p class="sub">'+esc(h.name)+'</p><div class="tabs">'+STEPS.map(function(t,ix){return '<button type="button" data-act="step" data-ix="'+ix+'">'+(ix+1)+'. '+t+'</button>';}).join('')+'</div><form id="inspForm" class="screen" style="animation:none">'+
  '<div class="step" data-step="0"><label for="f_date">Date</label><input type="date" id="f_date" data-f="date" value="'+esc(draft.date)+'">'+tf('weather','Sunny, 24°C…')+'<div class="chips">'+WEATHER.slice(0,6).map(function(w){return '<button type="button" data-act="wx" data-v="'+w+'">'+cap(w)+'</button>';}).join('')+'</div>'+
  '<div class="lbl">Colony strength</div>'+seg('strength',['weak','medium','strong'])+'<div class="lbl">Queen seen?</div>'+seg('queenSeen',['yes','no'],['Yes, seen','Not seen'])+'</div>'+
  '<div class="step" data-step="1" hidden><div class="lbl">Brood pattern</div>'+seg('brood',BROOD,['Solid','Spotty','Patchy','None'])+'<div class="lbl">Honey stores</div>'+seg('honey',HONEY)+tf('pests','Varroa, SHB, chalkbrood…',1)+tf('treatments','Product, dose…')+'</div>'+
  '<div class="step" data-step="2" hidden>'+tf('notes','Anything else…',1)+'<div class="lbl">Photos</div><div id="thumbs">'+thumbsHtml(draft.photos,true)+'</div><label class="btn" for="f_photos" style="margin-top:8px;width:100%;color:var(--text)">&#128247; Add photos</label><input id="f_photos" type="file" accept="image/*" capture="environment" multiple hidden><div id="busy" class="busy" hidden>Processing photos…</div></div>'+
  '<div class="bar"><button type="button" id="prevBtn" data-act="prev">Cancel</button><button type="button" id="nextBtn" class="primary" data-act="next">Next &rsaquo;</button></div></form>';}
function showStep(){var k=draft.step||0;app.querySelectorAll('.step').forEach(function(el){el.hidden=+el.dataset.step!==k;});
  app.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-current',+b.dataset.ix===k);});
  document.getElementById('prevBtn').innerHTML=k?'&lsaquo; Back':'Cancel';var n=document.getElementById('nextBtn');n.innerHTML=k===2?'&#10003; Save':'Next &rsaquo;';n.dataset.act=k===2?'save':'next';}
function setStep(k){draft.step=Math.max(0,Math.min(2,k));showStep();}
function thumbsHtml(photos,editable){if(!photos.length)return editable?'<div class="meta">No photos yet &ndash; tap below to take or pick some.</div>':empty('photo','No photos','No photos were taken during this inspection.');
  return '<div class="thumbs">'+photos.map(function(p,ix){return '<div class="thumb"><button type="button" style="all:unset;display:block;width:100%;height:100%;cursor:pointer" data-act="view" data-ix="'+ix+'" aria-label="View photo '+(ix+1)+'"><img src="'+p+'" alt="Photo '+(ix+1)+'"></button>'+(editable?'<button type="button" class="x" data-act="rmPhoto" data-ix="'+ix+'" aria-label="Remove photo">&times;</button>':'')+'</div>';}).join('')+'</div>';}
function curInsp(){var h=hive(route.id);return h&&h.inspections.filter(function(i){return i.id===route.iid;})[0];}
function vInsp(){var i=curInsp();if(!i){route={name:'hive',id:route.id};return vHive();}
  var rows=[['Weather',i.weather],['Strength',i.strength],['Queen seen',i.queenSeen],['Brood',i.brood],['Honey',i.honey],['Pests',i.pests],['Treatments',i.treatments],['Notes',i.notes]];
  return '<h1>'+esc(fmtDate(i.date))+'</h1><p class="sub">'+esc(hive(route.id).name)+'</p><div class="panel"><div class="card"><dl class="dl">'+rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+(r[1]?esc(r[1]):'—')+'</dd>';}).join('')+'</dl></div><div class="lbl">Photos</div>'+thumbsHtml(i.photos,false)+'</div><div class="bar"><button class="danger" data-act="delInsp">Delete inspection</button></div>';}

/* ---------- photos ---------- */
function resize(file,max,q){return new Promise(function(res,rej){var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Could not read image'));};img.src=url;});}
function overlay(title,body,cls){var v=document.createElement('div');v.className='overlay '+(cls||'');v.setAttribute('role','dialog');v.setAttribute('aria-modal','true');
  v.innerHTML='<div class="ohead"><div class="title" style="flex:1">'+title+'</div><button class="primary" data-close>Close &times;</button></div>'+body;
  v.addEventListener('click',function(e){if(e.target.closest('[data-close]'))v.remove();});document.body.appendChild(v);return v;}
function viewer(src){var v=overlay('Photo','<img alt="Photo full size">','viewer');v.querySelector('img').src=src;v.querySelector('img').onclick=function(){v.remove();};}

  watchdog=setTimeout(function(){if(rec===r&&!started){failed=true;try{r.abort();}catch(e){}micBlocked('timeout');}},5000);
  try{r.start();}catch(e){failed=true;clearTimeout(watchdog);if(e&&e.name==='InvalidStateError'){voiceProblem('Voice was busy – tap the mic again.');}else micBlocked('start');return;}

function dictateInto(el){if(!el)return;listen('Dictating into '+(el.placeholder?'the box':'field'),function(t){var v=el.value;el.value=(v&&!/\s$/.test(v)?v+' ':v)+t;el.dispatchEvent(new Event('input',{bubbles:true}));},app.querySelector('.mic[data-target="'+el.id+'"]'));}

var NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,first:1,second:2,third:3,fourth:4,fifth:5,to:2,too:2,for:4,won:1};
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean).map(function(w){return NUM.hasOwnProperty(w)&&w!=='to'&&w!=='for'&&w!=='too'&&w!=='won'?String(NUM[w]):w;}).join(' ');}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function sim(a,b){if(!a||!b)return 0;if(a===b)return 1;if(a.indexOf(b)>=0||b.indexOf(a)>=0)return 0.85*Math.min(a.length,b.length)/Math.max(a.length,b.length)+0.15;return 1-lev(a,b)/Math.max(a.length,b.length);}
function bestMatch(phrase,items,key,min){var p=norm(phrase),best=null,bs=0;items.forEach(function(it){var k=norm(key(it)),s=sim(p,k);var nk=k.replace(/^hive\s+/,''),np=p.replace(/^hive\s+/,'');s=Math.max(s,sim(np,nk));if(s>bs){bs=s;best=it;}});return bs>=(min||0.6)?best:null;}
function wordHit(words,opt,min){var ow=opt.split(' ');return words.some(function(w,ix){var cand=words.slice(ix,ix+ow.length).join(' ');return sim(cand,opt)>=(min||0.8);});}
function command(text){var t=norm(text),w=t.split(' ');
  function has(re){return re.test(t);}
  if(has(/\b(help|install)\b/)){openHelp();return 'Help';}
  if(route.name==='home'||route.name==='hive'||route.name==='insp'){
    if(has(/\badd\b.*\bhive\b|\bnew hive\b/)&&!has(/inspection/)){go({name:'addHive'});return 'Add hive';}
    if(has(/inspect/)&&has(/\b(add|new|start)\b/)){var target=route.name==='home'?null:hive(route.id);
      if(!target){var rest=t.replace(/\b(add|new|start|an?|inspection|inspect|to|for|on)\b/g,' ').trim();target=rest?bestMatch(rest,state.hives,function(h){return h.name;}):(state.hives.length===1?state.hives[0]:null);}
      if(target){route={name:'hive',id:target.id};newInsp();return 'New inspection: '+target.name;}
      return toast('Which hive? Say e.g. “add inspection hive 1”.',true);}
    if(has(/^(go )?(back|home)\b/)){backBtn.onclick();return 'Back';}
    if(route.name==='hive'&&has(/^(open )?(last|latest)/)){var h0=hive(route.id),li=h0.inspections.slice().sort(cmp)[0];if(li){go({name:'insp',id:h0.id,iid:li.id});return 'Latest inspection';}}
    var q=t.replace(/^(open|show|go to|select)\s+/,''),m=bestMatch(q,state.hives,function(h){return h.name;});
    if(m){go({name:'hive',id:m.id});return 'Opened '+m.name;}
    return toast('Didn’t catch a hive or command in “'+text+'”. Try “open hive 1” or “add hive”.',true);}
  if(route.name==='addHive'){if(has(/^(save|done)$/)){app.querySelector('#hiveForm').requestSubmit();return 'Save';}if(has(/^cancel$/)){go({name:'home'});return 'Cancel';}
    var hn=document.getElementById('hName');if(!hn.value){hn.value=text.replace(/^(name|call it)\s+/i,'');return 'Name set';}var hno=document.getElementById('hNotes');hno.value=(hno.value?hno.value+' ':'')+text;return 'Added to notes';}
  if(route.name==='form'){var did=[];
    var fields={weather:['weather'],pests:['pests','pest','disease','mites','varroa'],treatments:['treatment','treatments','treated'],notes:['notes','note','comment'],date:['date']};
    for(var f in fields){var kw=fields[f].filter(function(k){return w[0]===k||sim(w[0],k)>=0.8;})[0];if(kw&&!(f==='weather'&&w.length>1&&WEATHER.some(function(x){return t.indexOf(x)>=0;})&&false)){
      var restT=text.trim().split(/\s+/).slice(1).join(' ');var step=f==='weather'||f==='date'?0:f==='notes'?2:1;setStep(step);var el=document.getElementById('f_'+f);el.focus();
      if(f==='date')return 'Date field';
      if(restT){el.value=(el.value?el.value.replace(/\s*$/,' '):'')+restT;el.dispatchEvent(new Event('input',{bubbles:true}));return TEXTF[f]+' updated';}
      setTimeout(function(){dictateInto(el);},300);return TEXTF[f]+': speak now';}}
    if(has(/^(save|done|finish)( inspection)?$/)){submitInsp();return 'Save';}
    if(has(/^cancel$/)){cancelForm();return 'Cancel';}
    if(has(/^(next|continue)$/)){setStep((draft.step||0)+1);return 'Next';}
    if(has(/^(back|previous)$/)){setStep((draft.step||0)-1);return 'Back';}
    if(has(/\b(photo|picture|camera)\b/)){setStep(2);document.getElementById('f_photos').click();return 'Photos';}
    var honeyCtx=has(/\b(honey|stores|store|stored|food|nectar)\b/),broodCtx=has(/\bbrood\b/);
    if(has(/\bqueen\b/)){if(has(/\b(no|not|didn t|didnt|missing|none|without)\b/))setSeg('queenSeen','no');else setSeg('queenSeen','yes');did.push('Queen');}
    if(broodCtx){var bo=BROOD.filter(function(o){return wordHit(w,o.split(' ')[0]);})[0];if(bo){setSeg('brood',bo);did.push('Brood '+bo);}}
    if(honeyCtx){var ho=HONEY.filter(function(o){return wordHit(w,o);})[0]||(has(/\b(high|lots|plenty|heavy|packed)\b/)?'full':has(/\b(light|little|short|empty|poor)\b/)?'low':has(/\b(ok|okay|decent|fine)\b/)?'good':null);if(ho){setSeg('honey',ho);did.push('Honey '+ho);}}
    if(!honeyCtx){var so=['weak','medium','strong'].filter(function(o){return wordHit(w,o);})[0];if(so){setSeg('strength',so);did.push(cap(so));}}
    if(!broodCtx){var bo2=['solid','spotty','patchy'].filter(function(o){return wordHit(w,o,0.85);})[0];if(bo2){setSeg('brood',bo2);did.push('Brood '+bo2);}}
    var wx=WEATHER.filter(function(o){return wordHit(w,o,0.85);});wx.forEach(addWeather);if(wx.length)did.push('Weather');
    if(did.length){showStepSoon();return did.join(', ');}
    return toast('Didn’t match an option in “'+text+'”. Try “strong”, “queen seen”, “sunny”, “next” or “notes …”.',true);}
}

function addWeather(word){var el=document.getElementById('f_weather'),v=draft.weather||'';if(new RegExp('\\b'+word+'\\b','i').test(v))return;draft.weather=v?v.replace(/[\s,]*$/,'')+', '+word:cap(word);if(el)el.value=draft.weather;}

function hfField(){var a=document.activeElement;return a&&app.contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&(!a.type||a.type==='text')))?a:null;}
function hfHandle(t){var el=hfField(),n=norm(t);
  if(el&&!/^(next|save|done|back|previous|cancel|stop|finish)( inspection)?$/.test(n)){var v=el.value;el.value=(v&&!/\s$/.test(v)?v+' ':v)+t.trim();el.dispatchEvent(new Event('input',{bubbles:true}));hfShow('Hands-free listening','✓ added: '+t.trim());return;}
  if(/^(stop|stop listening|push to talk|hands free off)$/.test(n)){setHF(false);return;}
  var r=command(t);hfShow('Hands-free listening',r?'✓ '+r:t);}
function hfStart(){if(!hfOn||document.hidden||hfRec)return;var r;try{r=new SR();}catch(e){setHF(false,true);voiceProblem('Could not start voice input.',GBOARD);return;}
  hfRec=r;r.lang=navigator.language||'en-US';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;var fatal=false,gotAny=false,hst=false;
  var hwd=setTimeout(function(){if(hfRec===r&&!hst&&hfOn){fatal=true;try{r.abort();}catch(e){}micBlocked('timeout');}},5000);
  r.onstart=function(){hst=true;clearTimeout(hwd);clearBlock();if(hfRec===r)hfShow('Hands-free listening');};
  r.onresult=function(e){if(hfRec!==r)return;var tmp='';for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal){gotAny=true;hfErrors=0;hfHandle(t);}else tmp+=t;}if(tmp)hfShow('Hands-free listening',tmp.trim()+'…');};
  r.onerror=function(e){if(hfRec!==r)return;var er=e.error;
    if(er==='not-allowed'||er==='service-not-allowed'){fatal=true;micBlocked(er);return;}
    if(er==='audio-capture'||er==='language-not-supported'){fatal=true;setHF(false,true);voiceProblem(VERR[er],GBOARD);return;}
    if(er==='no-speech'||er==='aborted')return;hfErrors++;hfShow('Hands-free: retrying…',VERR[er]||er);};
  r.onend=function(){if(hfRec!==r)return;hfRec=null;if(fatal||!hfOn)return;
    if(hfErrors>=4){setHF(false,true);voiceProblem('Hands-free stopped after repeated errors. '+(VERR.network),GBOARD);return;}
    hfSchedule();};
  try{r.start();}catch(e){hfRec=null;hfErrors++;if(hfErrors>=4){micBlocked('start');}else hfSchedule();}}
document.addEventListener('visibilitychange',function(){if(!hfOn)return;if(document.hidden){hfStop();hfShow('Hands-free paused');}else{hfErrors=0;hfStart();}});
hfBtn.onclick=function(){setHF(!hfOn);};
micBtn.onclick=function(){if(hfOn){setHF(false);return;}listen(route.name==='form'?'Say an option, e.g. “strong”, “low on stores”, “next”':'Say e.g. “open hive 1” or “add inspection”',function(t){var r=command(t);if(r)toast('✓ '+r);});};
document.getElementById('helpBtn').onclick=openHelp;
app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='home')go({name:'home'});
  else if(a==='addHive')go({name:'addHive'});
  else if(a==='openHive')go({name:'hive',id:b.dataset.id});
  else if(a==='newInsp')newInsp();
  else if(a==='openInsp')go({name:'insp',id:route.id,iid:b.dataset.id});
  else if(a==='dictate')dictateInto(document.getElementById(b.dataset.target));
  else if(a==='step')setStep(+b.dataset.ix);
  else if(a==='next')setStep((draft.step||0)+1);
  else if(a==='prev'){if((draft.step||0)>0)setStep(draft.step-1);else cancelForm();}
  else if(a==='save')submitInsp();
  else if(a==='wx')addWeather(b.dataset.v);
  else if(a==='seg'){var f=b.dataset.f;setSeg(f,draft[f]===b.dataset.v?'':b.dataset.v);}
  else if(a==='rmPhoto'){draft.photos.splice(+b.dataset.ix,1);document.getElementById('thumbs').innerHTML=thumbsHtml(draft.photos,true);}
  else if(a==='view'){var ph=route.name==='form'?draft.photos:curInsp().photos;viewer(ph[+b.dataset.ix]);}
  else if(a==='delHive'){var h=hive(route.id);if(confirm('Delete "'+h.name+'" and all '+h.inspections.length+' inspection(s)? This cannot be undone.')){state.hives=state.hives.filter(function(x){return x!==h;});save();toast('Hive deleted');go({name:'home'});}}
  else if(a==='delInsp'){if(confirm('Delete this inspection and its photos? This cannot be undone.')){var hv=hive(route.id);hv.inspections=hv.inspections.filter(function(x){return x.id!==route.iid;});save();toast('Inspection deleted');go({name:'hive',id:route.id});}}
});
app.addEventListener('input',function(e){var f=e.target.dataset&&e.target.dataset.f;if(f&&draft&&route.name==='form')draft[f]=e.target.value;});
app.addEventListener('change',function(e){if(e.target.id!=='f_photos')return;var files=[].slice.call(e.target.files||[]);e.target.value='';if(!files.length)return;
  var busy=document.getElementById('busy');busy.hidden=false;
  files.reduce(function(p,f){return p.then(function(){return resize(f,1024,0.7).then(function(d){draft.photos.push(d);},function(){toast('Skipped a file that could not be read as an image.',true);});});},Promise.resolve())
  .then(function(){var bz=document.getElementById('busy');if(bz)bz.hidden=true;var t=document.getElementById('thumbs');if(t)t.innerHTML=thumbsHtml(draft.photos,true);});});
app.addEventListener('submit',function(e){e.preventDefault();
  if(e.target.id==='hiveForm'){var n=document.getElementById('hName').value.trim();if(!n){toast('Please enter a hive name',true);return;}
    var h={id:uid(),name:n,notes:document.getElementById('hNotes').value.trim(),created:Date.now(),inspections:[]};state.hives.push(h);if(save()){toast('Hive added');go({name:'hive',id:h.id});}}
  else if(e.target.id==='inspForm'){if((draft.step||0)<2)setStep(draft.step+1);else submitInsp();}});
window.HiveNotes={openMicGuide:openMicGuide,openSetup:openSetup,uaKind:uaKind,fixSteps:fixSteps,micBlocked:micBlocked,setHF:setHF,isHF:function(){return hfOn;},resize:resize,validate:validate,importHives:importHives,command:command,getState:function(){return state;},getDraft:function(){return draft;},KEY:KEY};
render();
try{if(!localStorage.getItem('hiveNotes.setupSeen'))openSetup(true);}catch(e){}
hfUI();try{if(localStorage.getItem(HFKEY)==='1')setHF(true,true);}catch(e){}
})();
</script>
</body>
